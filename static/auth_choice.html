<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome — Health Assistant</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc; --card: #ffffff; --border: #e2e8f0; --shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --text-primary: #1e293b; --text-secondary: #64748b; --primary: #1e40af; --radius-lg: 24px; --radius: 12px;
            --transition: all 0.2s ease-in-out;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
        .card { 
            background: var(--card); 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow); 
            max-width: 800px; 
            width: 100%; 
            overflow: hidden; 
        }
        .hero { 
            background: linear-gradient(135deg, var(--primary), #1d4ed8); 
            color: white; 
            padding: 3rem 2rem; 
            text-align: center; 
        }
        .logo { 
            font-size: 2rem; 
            margin-bottom: 1rem; 
            opacity: 0.9; 
        }
        .hero h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .hero p { font-size: 1.125rem; opacity: 0.95; max-width: 500px; margin: 0 auto; }
        .forms-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 3rem; 
            padding: 3rem 2rem; 
        }
        .form-group h2 { 
            font-size: 1.5rem; 
            font-weight: 600; 
            margin-bottom: 1.5rem; 
            text-align: center; 
        }
        .field { margin-bottom: 1.25rem; }
        label { display: block; color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; margin-bottom: 0.5rem; }
        input { 
            width: 100%; padding: 0.875rem 1.125rem; border: 2px solid var(--border); border-radius: var(--radius); font-size: 1rem; transition: var(--transition); 
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgb(30 64 175 / 0.1); }
        .btn { 
            width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--primary), #1d4ed8); color: white; border: none; border-radius: var(--radius); 
            font-weight: 600; font-size: 1rem; cursor: pointer; transition: var(--transition); box-shadow: 0 4px 12px rgb(30 64 175 / 0.3); 
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgb(30 64 175 / 0.4); }
        @media (max-width: 768px) { 
            .forms-container { grid-template-columns: 1fr; gap: 2rem; padding: 2rem 1.5rem; } 
            .hero { padding: 2rem 1.5rem; } 
            .hero h1 { font-size: 2rem; } 
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="hero">
            <div class="logo">🏥</div>
            <h1>Health Assistant</h1>
            <p>AI-powered health companion for symptoms, advice, and appointments</p>
        </div>

        <div class="forms-container">
            <div class="form-group">
                <h2>Sign In</h2>
                <form id="login-form">
                    <div class="field">
                        <label>Email</label>
                        <input name="email" type="email" placeholder="your@email.com" required>
                    </div>
                    <div class="field">
                        <label>Password</label>
                        <input name="password" type="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn" hx-post="/login" hx-target="#login-form" hx-swap="outerHTML">Sign In</button>
                </form>
            </div>

            <div class="form-group">
                <h2>Create Account</h2>
                <form id="register-form">
                    <div class="field">
                        <label>Full Name</label>
                        <input name="full_name" placeholder="John Doe" required>
                    </div>
                    <div class="field">
                        <label>Email</label>
                        <input name="email" type="email" placeholder="your@email.com" required>
                    </div>
                    <div class="field">
                        <label>Phone</label>
                        <input name="phone" placeholder="+1 (555) 123-4567" required>
                    </div>
                    <div class="field">
                        <label>Password</label>
                        <input name="password" type="password" placeholder="At least 8 characters" required>
                    </div>
                    <button type="submit" class="btn" hx-post="/register" hx-target="#register-form" hx-swap="outerHTML">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
