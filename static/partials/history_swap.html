<div id="history-messages">
{% for msg in messages %}
    <div class="message-row {{ msg.role }}">
        <div class="bubble {{ msg.role }}">
            <div style="font-size:0.95rem;">{{ msg.content }}</div>
            <div style="font-size:0.75rem; color:var(--muted); margin-top:0.25rem;">{{ msg.timestamp | default('') }}</div>
        </div>
    </div>
{% endfor %}
</div>

<script>
    (function(){
        // update the hidden session input (use id if present)
        const sidInput = document.getElementById('session_id') || document.querySelector('input[name="session_id"]');
        if (sidInput) { sidInput.value = "{{ session_id }}"; }

        // show chat view (in case this partial was loaded via HTMX into the #chat-container)
        if (typeof showChat === 'function') {
            showChat();
        } else if (typeof scrollToBottom === 'function') {
            // fallback: ensure we at least scroll
            scrollToBottom();
        }

        // highlight the active chat in history sidebar
        if (typeof highlightActiveChat === 'function') {
            highlightActiveChat();
        }
    })();
</script>
