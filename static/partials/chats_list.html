{% if chats %}
    <div class="chats-card" style="display:flex; flex-direction:column; gap:0.6rem;">
    {% for c in chats %}
        <div class="chat-item" style="padding:0.32rem 0; border-bottom:1px solid rgba(15,23,42,0.06);">
            <a class="chat-history-item" data-session-id="{{ c.session_id }}" hx-get="/chats/load?session_id={{ c.session_id }}" hx-target="#chat-container" hx-swap="innerHTML" style="text-decoration:none; color:inherit; display:flex; gap:0.5rem; width:100%; align-items:center; padding:0.2rem 0; cursor:pointer;">
                <div style="width:36px; height:36px; border-radius:8px; background:linear-gradient(135deg,var(--accent-2),var(--accent-3)); display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:0.9rem;">C</div>
                <div style="flex:1; min-width:0;">
                    <div class="snippet" style="font-size:0.82rem; color:var(--text); line-height:1.2rem; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;">{{ c.last_message.content[:100] if c.last_message else 'No messages yet' }}</div>
                </div>
                <div style="color:var(--muted); font-size:0.78rem; margin-left:0.4rem;">{{ c.updated_at.strftime('%d %b') if c.updated_at else '' }}</div>
            </a>
        </div>
    {% endfor %}
    </div>
{% else %}
    <p style="color:#6b7280; font-size:0.9rem;">No previous chats yet. Start a new conversation!</p>
{% endif %}
