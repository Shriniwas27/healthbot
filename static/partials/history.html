{% for msg in messages %}
	<div class="message-row {{ msg.role }}">
		<div class="bubble {{ msg.role }}">
			<div style="font-size:0.92rem;">{{ msg.content }}</div>
			<div style="font-size:0.76rem; color:var(--muted); margin-top:0.35rem;">{{ msg.timestamp | default('') }}</div>
		</div>
	</div>
{% endfor %}
