<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In — Health Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1120; --panel: #111827; --card: #1a2236;
            --border: #1f2f4a; --accent: #3b82f6; --accent2: #06b6d4;
            --success: #10b981; --danger: #ef4444;
            --text: #f0f6ff; --muted: #6b7fa3; --label: #94a3c4;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
        }
        .left {
            position: relative; display: flex; flex-direction: column;
            justify-content: center; padding: 4rem;
            background: linear-gradient(145deg, #0b1829 0%, #0f2044 60%, #0d1a35 100%);
            overflow: hidden;
        }
        .left::before {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 30%, rgba(59,130,246,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 80% 70%, rgba(6,182,212,0.1) 0%, transparent 60%);
        }
        .left-content { position: relative; z-index: 1; }
        .logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 4rem; }
        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; box-shadow: 0 0 24px rgba(59,130,246,0.4);
        }
        .logo-name { font-family: 'DM Serif Display', serif; font-size: 1.3rem; letter-spacing: -0.02em; }
        .left h1 {
            font-family: 'DM Serif Display', serif; font-size: 3rem;
            line-height: 1.1; letter-spacing: -0.03em; margin-bottom: 1.25rem;
        }
        .left h1 em {
            font-style: italic;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .left p { font-size: 1rem; color: var(--muted); line-height: 1.7; max-width: 380px; }
        .right {
            background: var(--panel); display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 3rem 2rem;
        }
        .form-card { width: 100%; max-width: 400px; }
        .form-header { margin-bottom: 2rem; }
        .form-header h2 {
            font-family: 'DM Serif Display', serif; font-size: 1.75rem;
            letter-spacing: -0.02em; margin-bottom: 0.4rem;
        }
        .form-header p { font-size: 0.9rem; color: var(--muted); }
        .form-header a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .field { margin-bottom: 1.25rem; }
        label {
            display: block; font-size: 0.78rem; font-weight: 500; color: var(--label);
            margin-bottom: 0.4rem; letter-spacing: 0.04em; text-transform: uppercase;
        }
        input {
            width: 100%; background: var(--card); border: 1.5px solid var(--border);
            border-radius: 10px; padding: 0.75rem 1rem; color: var(--text);
            font-family: 'DM Sans', sans-serif; font-size: 0.925rem;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
        input::placeholder { color: var(--muted); }
        .alert { padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
        .alert.error   { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; display: block; }
        .alert.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; display: block; }
        .btn {
            width: 100%; padding: 0.85rem; border-radius: 10px;
            font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600;
            cursor: pointer; border: none; margin-top: 0.5rem;
            background: linear-gradient(135deg, var(--accent), #2563eb);
            color: white; box-shadow: 0 4px 16px rgba(59,130,246,0.3);
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            margin-right: 0.5rem; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 900px) {
            body { grid-template-columns: 1fr; }
            .left { display: none; }
        }
    </style>
</head>
<body>
<div class="left">
    <div class="left-content">
        <div class="logo">
            <div class="logo-icon">🏥</div>
            <span class="logo-name">Health Chatbot</span>
        </div>
        <h1>Welcome<br/><em>back.</em></h1>
        <p>Sign in to continue your health journey. Your AI assistant is ready when you are.</p>
    </div>
</div>

<div class="right">
    <div class="form-card">
        <div class="form-header">
            <h2>Sign in</h2>
            <p>Don't have an account? <a href="/register">Create one</a></p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="priya@example.com" autocomplete="email"/>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password"
                   onkeydown="if(event.key==='Enter') login()"/>
        </div>

        <button class="btn" id="login-btn" onclick="login()">Sign In</button>
    </div>
</div>

<script>
    async function login() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('login-btn');
        const alert    = document.getElementById('alert');

        if (!email || !password) {
            alert.className = 'alert error';
            alert.textContent = 'Please enter your email and password.';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Signing in...';
        alert.className = 'alert';

        try {
            const resp = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });
            const data = await resp.json();

            if (resp.ok) {
                alert.className = 'alert success';
                alert.textContent = `Welcome back, ${data.full_name.split(' ')[0]}! Redirecting...`;
                setTimeout(() => window.location.href = '/', 1000);
            } else {
                alert.className = 'alert error';
                alert.textContent = data.detail || 'Login failed.';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        } catch {
            alert.className = 'alert error';
            alert.textContent = 'Network error. Please try again.';
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    }
</script>
</body>
</html>
