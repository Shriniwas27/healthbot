<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In — Health Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --white: #ffffff;
            --off: #f7f8fc;
            --border: #e4e7ef;
            --text: #111827;
            --muted: #9399aa;
            --accent: #4a7c59;
            --accent-dark: #3a6b48;
            --panel-top: #7ecef4;
            --panel-mid: #6a9bf4;
            --panel-bot: #5b5fc7;
            --success: #10b981;
            --danger: #ef4444;
            --label: #6b7280;
        }

        body {
            font-family: 'Sora', system-ui, sans-serif;
            background: var(--white);
            min-height: 100vh;
            display: grid;
            grid-template-columns: 42% 58%;
        }

        /* ── LEFT PANEL ─────────────────────────── */
        .left {
            background: var(--white);
            display: flex;
            flex-direction: column;
            padding: 2.5rem 3.5rem;
            min-height: 100vh;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 3.5rem;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            position: relative;
        }
        .logo-mark svg { width: 100%; height: 100%; }

        .logo-text {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .form-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Sora', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            min-width: 420px;
            line-height: 1.15;
            color: var(--text);
            letter-spacing: -0.03em;
            margin-bottom: 2.5rem;
        }



        .field {
            margin-bottom: 1.75rem;
            position: relative;
        }

        .field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--label);
            margin-bottom: 0.5rem;
        }

        .field input {
            width: 100%;
            min-width: 420px;
            background: transparent;
            border: none;
            border-bottom: 1.5px solid var(--border);
            padding: 0.85rem 0;
            font-family: 'Sora', sans-serif;
            font-size: 1.05rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        .field input::placeholder { color: var(--muted); font-weight: 300; }
        .field input:focus { border-color: var(--accent); }

        .field-suffix {
            position: absolute;
            right: 0;
            bottom: 0.6rem;
            color: var(--muted);
            cursor: pointer;
            font-size: 1.1rem;
        }



        .btn-primary {
            width: 100%;
            padding: 1.1rem;
            background: var(--accent);
            color: white;
            font-family: 'Sora', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.01em;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(74, 124, 89, 0.35);
            margin-bottom: 1.75rem;
        }
        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(91,127,255,0.45);
        }
        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .signup-row {
            font-size: 0.875rem;
            color: var(--label);
        }
        .signup-row a {
            color: var(--accent-dark);
            font-weight: 600;
            text-decoration: none;
        }
        .signup-row a:hover { text-decoration: underline; }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            font-weight: 500;
        }
        .alert.error   { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); color: var(--danger); display: block; }
        .alert.success { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.25); color: var(--success); display: block; }

        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .right {
            position: relative;
            overflow: hidden;
            background: linear-gradient(175deg, #5ec796 0%, #4a9e7f 22%, #4a7c59 50%, #3a6245 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 4rem 4rem 5rem;
        }

        /* Geometric tile pattern at top */
        .tile-pattern {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 100%;
            overflow: hidden;
            opacity: 0.39;
        }

        .tile-pattern svg {
            width: 100%;
            height: 100%;
        }

        .right-content {
            position: relative;
            z-index: 2;
        }

        .right h2 {
            font-family: 'Sora', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            color: white;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            max-width: 480px;
        }

        .right p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.75);
            font-style: italic;
            font-weight: 300;
            line-height: 1.7;
            max-width: 400px;
        }

        @media (max-width: 900px) {
            body { grid-template-columns: 1fr; }
            .right { display: none; }
            .left { padding: 2rem; }
        }

        /* Subtle page-load animation */
        .left { animation: slideIn 0.5s ease both; }
        .right { animation: fadeIn 0.6s 0.1s ease both; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-16px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .form-area > * { animation: riseIn 0.45s ease both; }
        .form-area > *:nth-child(1) { animation-delay: 0.1s; }
        .form-area > *:nth-child(2) { animation-delay: 0.18s; }
        .form-area > *:nth-child(3) { animation-delay: 0.22s; }
        .form-area > *:nth-child(4) { animation-delay: 0.26s; }
        .form-area > *:nth-child(5) { animation-delay: 0.3s; }
        .form-area > *:nth-child(6) { animation-delay: 0.34s; }
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="left">
    <div class="logo">
        <div class="logo-mark">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="18" height="18" rx="5" fill="#4a7c59"/>
                <rect x="10" y="10" width="18" height="18" rx="5" fill="#5a9469" opacity="0.85"/>
            </svg>
        </div>
        <span class="logo-text">Health Assistant</span>
    </div>

    <div class="form-area">
        <h1>Sign into<br/>your account</h1>

        <div id="alert" class="alert"></div>

        <form id="login-form" method="POST" action="/login" onsubmit="return handleLogin(event)" novalidate>
            <div class="field">
                <label>Your Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required/>
            </div>

            <div class="field">
                <label>Password</label>
                <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required/>
                <span class="field-suffix" id="pw-toggle" title="Show/hide password">🙈</span>
            </div>

            <button type="submit" class="btn-primary" id="login-btn">Login</button>
        </form>

        <div class="signup-row">
            Don't have an account yet? <a href="/register">Sign up</a>
        </div>
    </div>
</div>

<div class="right">

    <div class="tile-pattern">
        <svg viewBox="0 0 800 420" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <clipPath id="tile-clip">
                    <rect width="800" height="420"/>
                </clipPath>
            </defs>
            <g clip-path="url(#tile-clip)" opacity="0.5">
                <!-- Row of rounded squares / circles alternating -->
                <!-- Row 1 -->
                <rect x="-10" y="-10" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
                <rect x="90" y="-10" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
                <rect x="190" y="-10" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
                <rect x="290" y="-10" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
                <rect x="390" y="-10" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
                <rect x="490" y="-10" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
                <rect x="590" y="-10" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
                <rect x="690" y="-10" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>

                <!-- Row 1 filled -->
                <circle cx="45" cy="45" r="28" fill="rgba(255,255,255,0.12)"/>
                <rect x="102" y="2" width="66" height="66" rx="33" fill="rgba(255,255,255,0.08)"/>
                <circle cx="235" cy="45" r="28" fill="rgba(255,255,255,0.1)"/>
                <rect x="302" y="2" width="66" height="66" rx="8" fill="rgba(255,255,255,0.07)"/>
                <circle cx="435" cy="45" r="28" fill="rgba(255,255,255,0.12)"/>
                <rect x="502" y="2" width="66" height="66" rx="33" fill="rgba(255,255,255,0.08)"/>
                <circle cx="635" cy="45" r="28" fill="rgba(255,255,255,0.1)"/>
                <rect x="702" y="2" width="66" height="66" rx="8" fill="rgba(255,255,255,0.07)"/>

                <!-- Row 2 -->
                <circle cx="45" cy="145" r="28" fill="rgba(255,255,255,0.08)"/>
                <rect x="102" y="102" width="66" height="66" rx="8" fill="rgba(255,255,255,0.1)"/>
                <circle cx="235" cy="145" r="28" fill="rgba(255,255,255,0.07)"/>
                <rect x="302" y="102" width="66" height="66" rx="33" fill="rgba(255,255,255,0.12)"/>
                <circle cx="435" cy="145" r="28" fill="rgba(255,255,255,0.08)"/>
                <rect x="502" y="102" width="66" height="66" rx="8" fill="rgba(255,255,255,0.1)"/>
                <circle cx="635" cy="145" r="28" fill="rgba(255,255,255,0.07)"/>
                <rect x="702" y="102" width="66" height="66" rx="33" fill="rgba(255,255,255,0.12)"/>

                <!-- Row 2 outlines -->
                <rect x="-10" y="90" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
                <rect x="90" y="90" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
                <rect x="190" y="90" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
                <rect x="290" y="90" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
                <rect x="390" y="90" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
                <rect x="490" y="90" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
                <rect x="590" y="90" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
                <rect x="690" y="90" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>

                <!-- Row 3 — fading out -->
                <circle cx="45" cy="245" r="28" fill="rgba(255,255,255,0.05)"/>
                <rect x="102" y="202" width="66" height="66" rx="33" fill="rgba(255,255,255,0.04)"/>
                <circle cx="235" cy="245" r="28" fill="rgba(255,255,255,0.04)"/>
                <rect x="302" y="202" width="66" height="66" rx="8" fill="rgba(255,255,255,0.05)"/>
                <circle cx="435" cy="245" r="28" fill="rgba(255,255,255,0.04)"/>
                <rect x="502" y="202" width="66" height="66" rx="33" fill="rgba(255,255,255,0.04)"/>
                <circle cx="635" cy="245" r="28" fill="rgba(255,255,255,0.05)"/>

                <rect x="-10" y="190" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1" opacity="0.25"/>
                <rect x="90" y="190" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
                <rect x="190" y="190" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
                <rect x="290" y="190" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1" opacity="0.25"/>
                <rect x="390" y="190" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
                <rect x="490" y="190" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
                <rect x="590" y="190" width="90" height="90" rx="20" fill="none" stroke="white" stroke-width="1" opacity="0.25"/>
                <rect x="690" y="190" width="90" height="90" rx="45" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>

                <!-- Gradient fade overlay -->
                <defs>
                    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="transparent"/>
                        <stop offset="75%" stop-color="#6b81f2" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#6b81f2"/>
                    </linearGradient>
                </defs>
                <rect width="800" height="420" fill="url(#fade)"/>
            </g>
        </svg>
    </div>

    <div class="right-content">
        <h2>A smarter way<br/>to manage your<br/>health journey</h2>
        <p>AI-powered symptom checks, instant health advice, and seamless appointment scheduling — all in one place.</p>
    </div>
</div>

<script>
    const pwToggle = document.getElementById('pw-toggle');
    const pwInput  = document.getElementById('password');
    pwToggle.addEventListener('click', () => {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        pwToggle.textContent = isHidden ? '👁️' : '🙈';
    });

    // Alert helper
    function showAlert(msg, type) {
        const a = document.getElementById('alert');
        a.textContent = msg;
        a.className = `alert ${type}`;
    }

    // Check for registration success
    window.addEventListener('load', () => {
        const p = new URLSearchParams(window.location.search);
        if (p.get('registered') === 'true') {
            showAlert('Account created! Please sign in.', 'success');
            window.history.replaceState({}, '', '/login');
        }
    });

    function handleLogin(e) {
        const email = document.getElementById('email').value.trim();
        const password = pwInput.value;
        if (!email || !password) {
            e.preventDefault();
            showAlert('Please fill in all fields.', 'error');
            return false;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            e.preventDefault();
            showAlert('Please enter a valid email address.', 'error');
            return false;
        }
        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Signing in…';
        return true;
    }
</script>
</body>
</html>
